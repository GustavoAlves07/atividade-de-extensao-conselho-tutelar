name: Verificação Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Testar o validador
        run: python3 -m unittest discover -s scripts -v
      - name: Validar, testar e compilar
        run: ./gradlew :app:verifyContent :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Guardar relatórios e APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-android
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Habilitar acesso do runner ao KVM
        run: |
          sudo sh -c 'echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar primeira jornada no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Guardar resultados do emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-instrumentados
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
